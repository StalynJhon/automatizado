name: CI/CD Pipeline

on:
  push:
    branches:
      - quintoa

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/stalynjhon/automatizado:1.0.0

    - name: comprobacion de variables (colo locales, no secretos)
      run: |
        echo "host: ${{ secrets.VPS_HOST }}"
        echo "username: ${{ secrets.VPS_USER }}"
        echo "password: ${{ secrets.VPS_PASSWORD }}"
        echo "port: ${{ secrets.VPS_SSH_PORT }}"

    - name: probar la conexion SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        port: ${{ secrets.VPS_SSH_PORT }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "Conexion exitosa Github Actions"
          hostname
          whoami
          uptime

    - name: pasar el stack.yml al sevidos
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/despliegue"

    - name: despliegue de los servicios
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        port: ${{ secrets.VPS_SSH_PORT }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "Desplegando servicios"

          docker stack rm cristhian || true

          docker pull ghcr.io/stalynjhon/automatizado:1.0.0

          echo "---> Desplegando stack ...."
          docker stack deploy -t stack.yml --with-registry-auth-cristhian
